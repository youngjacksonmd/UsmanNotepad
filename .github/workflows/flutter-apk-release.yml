name: UsmanNotepad APK Release Gate

on:
  push:
    branches: [phase0-1-flutter-core]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usman-notepad-apk-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Cache Android signing identity
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: usman-notepad-debug-signing-v1
      - name: Generate Android platform wrapper
        run: |
          flutter create --platforms=android --org com.usman --project-name usman_notepad .
          sed -i 's/com\.usman\.usman_notepad/com.usman.notepad/g' android/app/build.gradle.kts
          find android/app/src/main/kotlin -name '*.kt' -print0 | xargs -0 sed -i 's/com\.usman\.usman_notepad/com.usman.notepad/g'
          bash tool/apply_android_branding.sh
          rm -f test/widget_test.dart
      - name: Resolve packages
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build
      - name: Analyze production source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Core persistence and application tests
        run: flutter test test/core test/features
      - name: Phase 1 UI smoke test
        run: timeout 60s flutter test test/widget_smoke_test.dart
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify release APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: UsmanNotepad-Phase0-1-v4.0.1
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
