name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract uploaded Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project-src
          mkdir -p project-src
          unzip -q UsmanNotepad_Project.zip -d project-src

          SETTINGS_FILE="$(find project-src -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo 'No settings.gradle or settings.gradle.kts found inside ZIP.'
            exit 1
          fi
          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected project root: $PROJECT_ROOT"

      - name: Patch project to stable Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])
          root_gradle = root / "build.gradle.kts"
          app_gradle = root / "app" / "build.gradle.kts"

          root_text = root_gradle.read_text(encoding="utf-8")
          if 'version "9.4.0"' not in root_text:
              raise SystemExit("Expected AGP 9.4.0 declaration was not found")
          root_text = root_text.replace('version "9.4.0"', 'version "8.9.2"', 1)
          root_gradle.write_text(root_text, encoding="utf-8")

          app_text = app_gradle.read_text(encoding="utf-8")
          if "compileSdk = 37" not in app_text or "targetSdk = 37" not in app_text:
              raise SystemExit("Expected compileSdk/targetSdk 37 declarations were not found")
          app_text = app_text.replace("compileSdk = 37", "compileSdk = 35", 1)
          app_text = app_text.replace("targetSdk = 37", "targetSdk = 35", 1)
          if "buildToolsVersion" not in app_text:
              app_text = app_text.replace(
                  "compileSdk = 35",
                  'compileSdk = 35\n    buildToolsVersion = "35.0.0"',
                  1,
              )
          app_gradle.write_text(app_text, encoding="utf-8")

          print("===== Patched root build.gradle.kts =====")
          print(root_gradle.read_text(encoding="utf-8"))
          print("===== Patched app/build.gradle.kts =====")
          print(app_gradle.read_text(encoding="utf-8"))
          PY

      - name: Install stable Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle -p "$PROJECT_ROOT" --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk" -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" UsmanNotepad.apk
          ls -lh UsmanNotepad.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsmanNotepad-APK
          path: UsmanNotepad.apk
          if-no-files-found: error
