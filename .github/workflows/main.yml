name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract and inspect uploaded Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project-src
          mkdir -p project-src
          unzip -q UsmanNotepad_Project.zip -d project-src

          echo '===== Repository project files ====='
          find project-src -maxdepth 8 -type f -print | sort

          SETTINGS_FILE="$(find project-src -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo 'No settings.gradle or settings.gradle.kts found inside ZIP.'
            exit 1
          fi
          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected project root: $PROJECT_ROOT"

          echo '===== Important Android files ====='
          while IFS= read -r file; do
            echo "----- $file -----"
            sed -n '1,260p' "$file"
          done < <(find "$PROJECT_ROOT" -type f \( \
            -name 'settings.gradle' -o -name 'settings.gradle.kts' -o \
            -name 'build.gradle' -o -name 'build.gradle.kts' -o \
            -name 'gradle.properties' -o -name 'AndroidManifest.xml' -o \
            -name '*.java' -o -name '*.kt' \
          \) | sort)

      - name: Install stable Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle -p "$PROJECT_ROOT" --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk" -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" UsmanNotepad.apk
          ls -lh UsmanNotepad.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsmanNotepad-APK
          path: UsmanNotepad.apk
          if-no-files-found: error
