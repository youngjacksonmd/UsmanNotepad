name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2-implementation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Test and build V2.00
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" UsmanNotepad-V2.00.apk
          test -s UsmanNotepad-V2.00.apk
          unzip -t UsmanNotepad-V2.00.apk >/dev/null
          ls -lh UsmanNotepad-V2.00.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsmanNotepad-APK
          path: UsmanNotepad-V2.00.apk
          if-no-files-found: error
