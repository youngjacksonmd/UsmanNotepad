name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v3-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Test UsmanNotepad
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build UsmanNotepad
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Lint and build AuraEQ
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :auraeq:lintDebug :auraeq:assembleDebug --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          NOTEPAD_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          AURAEQ_APK="$(find auraeq/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$NOTEPAD_APK"
          test -n "$AURAEQ_APK"
          cp "$NOTEPAD_APK" UsmanNotepad-V3.00.apk
          cp "$AURAEQ_APK" AuraEQ-v1.0.0-debug.apk
          test -s AuraEQ-v1.0.0-debug.apk
          unzip -t AuraEQ-v1.0.0-debug.apk >/dev/null
          sha256sum AuraEQ-v1.0.0-debug.apk > AuraEQ-v1.0.0-debug.apk.sha256
          ls -lh UsmanNotepad-V3.00.apk AuraEQ-v1.0.0-debug.apk

      - name: Upload UsmanNotepad APK
        uses: actions/upload-artifact@v4
        with:
          name: UsmanNotepad-APK
          path: UsmanNotepad-V3.00.apk
          if-no-files-found: error

      - name: Upload AuraEQ APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraEQ-APK
          path: |
            AuraEQ-v1.0.0-debug.apk
            AuraEQ-v1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
