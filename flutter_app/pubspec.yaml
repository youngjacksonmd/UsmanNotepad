name: usman_notepad
description: Privacy-first offline-first notes application.
publish_to: none
version: 4.0.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.6.0
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.16.1
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
